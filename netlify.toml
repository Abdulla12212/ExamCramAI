[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These are public config names/values (e.g. "gemini"), not credentials.
  SECRETS_SCAN_OMIT_KEYS = "LLM_PROVIDER,GEMINI_MODEL,EMBEDDING_MODEL,EMBEDDING_PROVIDER,EMBEDDING_DIMENSIONS"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions.ingest]
  external_node_modules = ["pdfjs-dist"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
